services:
    yt-cipher:
        image: ghcr.io/kikkia/yt-cipher:master
        environment:
            - OVERRIDE_PLAYER_VARIANT=IAS
            - API_TOKEN=${YT_CIPHER_TOKEN}
        restart: always

    lavalink:
        image: ghcr.io/lavalink-devs/lavalink:4
        # Antes de arrancar Lavalink elige la versión del plugin de YouTube (ver lavalink-entrypoint.sh)
        entrypoint: ['sh', '/opt/Lavalink/lavalink-entrypoint.sh']
        environment:
            - YOUTUBE_PLUGIN_CHANNEL=${YOUTUBE_PLUGIN_CHANNEL:-}
        ports:
            # Solo accesible desde esta PC (para correr el bot fuera de Docker); el bot en Docker usa la red interna
            - '127.0.0.1:2333:2333'
        volumes:
            - ./application.yml:/opt/Lavalink/application.yml:ro
            - ./lavalink-entrypoint.sh:/opt/Lavalink/lavalink-entrypoint.sh:ro
            - ./plugins:/opt/Lavalink/plugins
        depends_on:
            - yt-cipher
        restart: always

    discord-bot:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            # Dentro de Docker, Lavalink es el servicio "lavalink" (el .env trae localhost para correr fuera de Docker)
            - lavalinkHost=lavalink
        volumes:
            # El código y las dependencias vienen en la imagen; de la PC solo el .env (Bun lo lee solo) y los datos
            - ./.env:/usr/src/app/.env:ro
            - ./logs:/usr/src/app/logs
            - ./.moonlink:/usr/src/app/.moonlink
        depends_on:
            - lavalink # Esto asegura que Lavalink se inicie primero
        restart: always